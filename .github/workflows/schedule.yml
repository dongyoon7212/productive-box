name: Update gist
on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Update gist
        uses: maxam2017/productive-box@master
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TIMEZONE: Asia/Seoul

      - name: Checkout
        uses: actions/checkout@v4

      - name: Keepalive
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          AGE=$(( (NOW - LAST) / 86400 ))
          echo "Last commit was $AGE day(s) ago."
          if [ "$AGE" -ge 50 ]; then
            echo "Pushing an empty commit to reset the 60-day inactivity timer."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive to prevent scheduled workflow auto-disable"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          else
            echo "No keepalive commit needed."
          fi
